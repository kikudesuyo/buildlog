steps:
  # 1. Dockerイメージのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/buildlog/api-$_RESOURCE_PREFIX:latest'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/buildlog/api-$_RESOURCE_PREFIX:$_COMMIT_SHA'
      - '.'

  # 2. Artifact Registryへのイメージプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/buildlog/api-$_RESOURCE_PREFIX'

  # 3. Cloud Runへのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'buildlog-api-$_RESOURCE_PREFIX'
      - '--image'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/buildlog/api-$_RESOURCE_PREFIX:$_COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8081'
      # コスト最小化スペック
      - '--cpu'
      - '1'
      - '--memory'
      - '256Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      # 環境変数の設定 (DATABASE_URLを除外)
      - '--update-env-vars'
      - 'IS_PRODUCTION=$_IS_PRODUCTION,API_DOMAIN=$_API_DOMAIN,ALLOWED_ORIGINS=$_ALLOWED_ORIGINS'
      # Secret Managerから環境変数へマウント
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/buildlog/api-$_RESOURCE_PREFIX:$_COMMIT_SHA'

substitutions:
  _COMMIT_SHA: 'latest'
  _ALLOWED_ORIGINS: ''

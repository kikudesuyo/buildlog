name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview pending migrations without applying them
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Atlas migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/328735755994/locations/global/workloadIdentityPools/buildlog-pool/providers/github-provider'
          service_account: 'github-actions-deployer@buildlog-503612.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Load production database URL from Secret Manager
        run: |
          PROD_DATABASE_URL="$(gcloud secrets versions access latest \
            --secret=DATABASE_URL \
            --project=buildlog-503612)"
          printf 'PROD_DATABASE_URL=%s\n' "$PROD_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Set up Atlas CLI
        uses: ariga/setup-atlas@v0

      - name: Check production database secret
        run: test -n "$PROD_DATABASE_URL"

      - name: Check migration directory
        working-directory: sql
        run: atlas migrate validate --dir "file://migrations"

      - name: Preview pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: sql
        run: atlas migrate apply --env prod --dry-run

      - name: Apply pending migrations
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        working-directory: sql
        run: atlas migrate apply --env prod

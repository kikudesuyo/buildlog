name: Deploy API Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-api-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_STAGING: buildlog-dev
  GCP_WIF_PROVIDER_STAGING: projects/328735755994/locations/global/workloadIdentityPools/buildlog-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT_STAGING: github-actions-deployer@buildlog-dev.iam.gserviceaccount.com

jobs:
  test-api:
    name: Test and Build Go API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Test Go API
        working-directory: api
        run: go test ./...

      - name: Build Go API
        working-directory: api
        run: go build -o ./app .

  deploy-api:
    name: Deploy Go API to Cloud Run Staging
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate staging configuration
        run: |
          test -n "$GCP_WIF_PROVIDER_STAGING"
          test -n "$GCP_SERVICE_ACCOUNT_STAGING"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_STAGING }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (via Cloud Build)
        working-directory: api
        env:
          GCP_PROJECT_STAGING: ${{ env.GCP_PROJECT_STAGING }}
        run: make deploy-staging GCP_PROJECT_STAGING="$GCP_PROJECT_STAGING" ALLOWED_ORIGINS=""

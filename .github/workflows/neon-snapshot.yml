name: Update Neon Database Snapshot

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

concurrency:
  group: neon-database-snapshot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NEON_PROJECT_ID: icy-pond-30220441
  NEON_API_URL: https://console.neon.tech/api/v2
  GCP_PROJECT_PROD: buildlog-503612
  GCP_WIF_PROVIDER_PROD: projects/328735755994/locations/global/workloadIdentityPools/buildlog-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT_PROD: github-actions-neon-snapshot@buildlog-503612.iam.gserviceaccount.com

jobs:
  update-snapshot:
    name: Replace the Neon database snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load Neon API key from Secret Manager
        run: |
          set -euo pipefail

          NEON_API_KEY="$(gcloud secrets versions access latest \
            --secret=NEON_API_KEY \
            --project="$GCP_PROJECT_PROD")"
          test -n "$NEON_API_KEY"
          echo "::add-mask::$NEON_API_KEY"
          printf 'NEON_API_KEY=%s\n' "$NEON_API_KEY" >> "$GITHUB_ENV"

      - name: Replace the existing snapshot
        run: python .github/scripts/update_neon_snapshot.py

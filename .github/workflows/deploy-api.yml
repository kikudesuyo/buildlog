name: Deploy API Production

on:
  workflow_dispatch:

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test-api:
    name: Test and Build Go API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Build Go API
        working-directory: api
        run: go build -o ./app .

  deploy-api:
    name: Deploy Go API to Cloud Run
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/328735755994/locations/global/workloadIdentityPools/buildlog-pool/providers/github-provider'
          service_account: 'github-actions-deployer@buildlog-503612.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (via Cloud Build)
        working-directory: api
        run: make deploy-prod

name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    name: Deploy Go API to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (via Cloud Build)
        run: |
          cd api
          make deploy-prod project=buildlog-503612

  deploy-web:
    name: Deploy SvelteKit to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Build Web App
        run: |
          cd web
          pnpm run build
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/.svelte-kit/cloudflare --project-name=buildlog
